name: Build Binary (Test)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'main'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync deps
        run: uv sync --dev

      - name: Build executable
        run: uv run pyinstaller --noconfirm logstash-agent.spec

      - name: Archive release bundle
        run: |
          mkdir -p release
          tar -czf release/logstash-agent-linux-amd64.tar.gz -C dist logstash-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logstash-agent-linux-amd64
          path: release/logstash-agent-linux-amd64.tar.gz
          retention-days: 7
